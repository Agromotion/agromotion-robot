# Configuração AgroMotion para MediaMTX v1.17.1

# --- API ---
api: yes
apiAddress: :9997

# --- RTSP ---
rtsp: yes
rtspAddress: :8554

# --- HLS ---
hls: yes
hlsAddress: :8888

# --- WebRTC ---
webrtc: yes
webrtcAddress: :8889

protocols: [udp, multicast, tcp]

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
  - url: turn:openrelay.metered.ca:80
    username: openrelayproject
    password: openrelayproject
  - url: turn:openrelay.metered.ca:443
    username: openrelayproject
    password: openrelayproject

# --- Paths ---
paths:
  robot:
    source: publisher
